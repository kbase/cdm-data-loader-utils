name: Run tests
permissions:
  contents: read

on:
  workflow_call:

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  code_format_and_lint:
    name: Check code formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run code formatting checks
        shell: bash
        run: uv run ruff format --check

      - name: Run code linting checks
        continue-on-error: true
        run: uv run ruff check --output-format=github .

  spark_tests:
    name: Run container tests
    needs: code_format_and_lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite:
          - name: spark
            args: tests/cdm_data_loaders/utils
          - name: integration
            args: tests/integration
          - name: pipelines
            args: tests/cdm_data_loaders/pipelines
          - name: all the rest
            args: --ignore=tests/cdm_data_loaders/utils --ignore=tests/integration --ignore=tests/cdm_data_loaders/pipelines

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run spark tests
        shell: bash
        continue-on-error: false
        run: |
          docker pull ghcr.io/kbasedatalakehouse/spark_notebook:main
          echo "Running tests inside container..."
          # slightly nasty hack
          chmod 777 .
          docker run --rm -e NB_USER=runner -v .:/tmp/cdm ghcr.io/kbasedatalakehouse/spark_notebook:main /bin/bash /tmp/cdm/scripts/run_tests.sh ${{matrix.suite.args}}

      - name: Send coverage to Codecov
        id: upload_coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  tests:
    name: Run local tests (${{ matrix.suite.name }}, ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: code_format_and_lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        os: ["ubuntu-24.04"]
        suite:
          - name: pipelines
            args: tests/cdm_data_loaders/pipelines/
          - name: integration
            args: tests/integration/
          - name: everything else
            args: --ignore=tests/integration --ignore=tests/cdm_data_loaders/pipelines

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run local tests
        shell: bash
        continue-on-error: false
        run: uv run pytest -m "not requires_spark and not requires_ceph" --cov --junitxml=junit.xml -o junit_family=legacy ${{matrix.suite.args}}

      - name: Send test reports to Codecov
        id: upload_test_reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
